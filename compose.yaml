services:
  frontend:
    image: nginx:alpine
    ports:
      - "5500:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./script.js:/usr/share/nginx/html/script.js:ro
      - ./assets:/usr/share/nginx/html/assets:ro
    depends_on:
      - backend
      - go-service

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/myshelf.db
    volumes:
      - myshelf-data:/data

  go-service:
    build: ./go_service
    ports:
      - "8080:8080"
    environment:
      PYTHON_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  myshelf-data: